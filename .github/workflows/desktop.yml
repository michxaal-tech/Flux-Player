name: Desktop build (Windows)

# Run by hand from the Actions tab, or with the API. It builds the same web
# app that deploys to Pages, wraps it in the Electron shell in desktop/, and
# publishes the installer to the `desktop-latest` release so it has a plain
# download link rather than living behind a workflow-artifact login.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installer to the desktop-latest release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Stage the build into the shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/app | Out-Null
          Copy-Item -Recurse -Force dist/* desktop/app/

      - name: Package
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win --publish never

      # Always kept, so a run that cannot publish still leaves something
      # downloadable.
      - uses: actions/upload-artifact@v4
        with:
          name: flux-player-windows
          path: desktop/out/*.exe
          if-no-files-found: error

      - name: Publish to the desktop-latest release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem desktop/out/*.exe | ForEach-Object { $_.FullName })
          if (-not $files) { throw "electron-builder produced no .exe" }
          gh release view desktop-latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload desktop-latest $files --clobber
          } else {
            gh release create desktop-latest $files `
              --target $env:GITHUB_SHA `
              --title "FLUX Player — Windows" `
              --notes "Windows build of FLUX Player. Run the Setup .exe to install, or the portable .exe to run without installing. Unsigned, so SmartScreen will ask once: More info -> Run anyway."
          }
